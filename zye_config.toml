# =============================================================================
# ZYE AI — Master Configuration
# =============================================================================
# This file defines all system settings, feature flags, security policies,
# and path configurations for the Zye AI assistant.
# =============================================================================

[system]
assistant_name = "Zye"
version = "0.1.0"
default_mission = "NORMAL_ASSISTANT"
min_free_disk_gb = 3.0
min_free_ram_gb = 1.5

[ai]
primary_provider = "gemini"
local_provider = "ollama"
model_routing_mode = "policy_based"
cloud_fallback_enabled = true
structured_output_enabled = true
request_timeout_seconds = 60

[ai.privacy]
local_first_for_private_data = true
redact_sensitive_data = true
send_files_to_cloud_by_default = false
require_explicit_cloud_upload = true

[features]
enable_smart_home = false
enable_background_watchdog = true
enable_meeting_reminders = true
enable_memory = false
enable_camera = false
enable_autonomous_execution = false

[security]
allow_arbitrary_shell_execution = false
allow_arbitrary_python_execution = false
require_tool_validation = true
require_action_audit = true
fail_closed_on_permission_error = true

[security.permissions]
read_operations = true
reversible_file_operations = true
external_message_sending_requires_confirmation = true
file_deletion_requires_confirmation = true
system_configuration_changes_require_confirmation = true

[performance]
max_concurrent_tasks = 3
default_task_timeout_seconds = 60
max_retry_attempts = 2

[audio]
enabled = true
sample_rate = 16000
channels = 1
sample_format = "float32"
frame_duration_ms = 32
pre_roll_seconds = 0.96
silence_timeout_seconds = 1.85
maximum_record_seconds = 25.0
minimum_record_seconds = 0.40
maximum_queue_frames = 64
noise_floor_initial = 0.008
vad_mode = "silero_onnx"
preferred_device_index = -1
chunk_size = 512
silence_timeout_sec = 1.85
pre_roll_chunks = 30
vad_start_threshold = 0.48
vad_hold_threshold = 0.40
tts_voice = "en-IN-NeerjaNeural"

[audio.agc]
enabled = true
mode = "peak_normalize"
target_peak = 0.85
max_gain = 12.0
min_gain = 0.50
silence_threshold = 0.00001
target_rms = 0.12
window_ms = 20
hop_ms = 10
attack_ms = 10.0
release_ms = 250.0
limiter_peak = 0.95
adaptive_mode_enabled = false

[audio.chimes]
enabled = true
start_first_frequency = 540.0
start_second_frequency = 820.0
stop_first_frequency = 780.0
stop_second_frequency = 480.0
tone_duration_ms = 75.0
amplitude = 0.12
fade_duration_ms = 12.5
vad_guard_ms = 250.0
max_queue_size = 4

[neural_vad]
enabled = true
backend = "silero_onnx"
fallback_backend = "adaptive_rms"
start_threshold = 0.52
hold_threshold = 0.40
start_confirmation_frames = 2
inference_device = "cpu"
warmup_enabled = true
auto_fallback = true
maximum_consecutive_inference_errors = 3

[observability]
structured_logging = true
redact_secrets = true
enable_debug_mode = false

[paths]
skills_dir = "skills"
data_dir = "data"
logs_dir = "logs"
backups_dir = "backups"
profiles_dir = "profiles"

[tts]
enabled = true
voice = "en-IN-NeerjaNeural"
rate = "+0%"
volume = "+0%"
pitch = "+0Hz"
timeout_seconds = 15.0
playback_enabled = true
playback_volume = 1.0

[text_input]
enabled = true
hotkey = "alt+z"
input_timeout_seconds = 60.0
max_input_length = 2000

[voice.tts]
enabled = true
provider = "edge_tts"
voice = "en-IN-NeerjaNeural"
format = "mp3"
timeout_seconds = 30
max_retries = 1
retry_delay_seconds = 1.0
max_text_chars = 4000

[voice.playback]
enabled = true
mixer_frequency = 44100
mixer_size = -16
mixer_channels = 2
mixer_buffer = 512
poll_interval_seconds = 0.05

[voice.hotkey]
enabled = true
shortcut = "alt+z"
fallback_to_terminal = true

[voice.clarity]
enabled = true
strict_mode = true
reject_empty_audio = true
reject_malformed_wav = true
block_tools_when_unclear = true
clarification_message = "Konjam clear-ah kekkala, thirumba solreengala?"

[voice.loop]
silence_timeout = 1.25
max_record_seconds = 25.0
max_history_turns = 16
max_tool_rounds = 8

[voice.privacy]
allow_cloud_tts = true
log_raw_audio = false
save_microphone_recordings = false

[voice.fallback]
text_mode_enabled = true
console_output_enabled = true
tts_failure_text_fallback = true

# =============================================================================
# DAY 11 — AUTONOMOUS INTELLIGENCE & DUAL-BRAIN DECISION SYSTEM
# =============================================================================

[autonomy]
enabled = true
strict_premortem = true
require_audit_for_mutating_tools = true
max_audit_retries = 1
max_tool_rounds = 8

[autonomy.premortem]
model = "gemini-2.5-flash"
temperature = 0.2
include_system_preflight = true
include_file_diagnostics = true
include_fmea = true
report_residual_risks = true

[autonomy.decision_matrix]
enabled = true
default_priority = "balanced"
generate_alternatives = true
max_candidates = 4

[autonomy.missions]
default_mission = "NORMAL_ASSISTANT"
automatic_suggestion = true
automatic_switching = true

[autonomy.watchdog]
enabled = true
interval_seconds = 25
ram_warning_pct = 95
disk_warning_pct = 92
battery_warning_pct = 15
battery_critical_pct = 8
error_log_tail_lines = 15
alert_cooldown_seconds = 600

[autonomy.emergency]
battery_reflex_enabled = true
ram_reflex_enabled = true
cyber_lockdown_enabled = true
allow_arbitrary_commands = false
require_verified_security_signal = true

[autonomy.execution]
require_confirmation_for_delete = true
require_confirmation_for_irreversible_overwrite = true
require_confirmation_for_external_email = true
require_confirmation_for_disruptive_network_changes = true
revalidate_before_execution = true
verify_after_execution = true

# =============================================================================
# DAY 12 — MASTER MCP ORCHESTRATION ENGINE & HOT RELOAD
# =============================================================================

[mcp_orchestrator]
enabled = true
startup_timeout_seconds = 20
tool_timeout_seconds = 30
max_tool_rounds = 8
max_parallel_startups = 4
max_parallel_tool_calls = 4
health_check_interval_seconds = 30
reload_drain_timeout_seconds = 15
registry_atomic_swap = true
allow_optional_server_failure = true

[mcp_orchestrator.recovery]
enabled = true
max_restart_attempts = 2
initial_backoff_seconds = 1
max_backoff_seconds = 15
circuit_breaker_enabled = true

[mcp_orchestrator.hot_reload]
enabled = true
staged_reload_preferred = true
require_candidate_validation = true
require_schema_refresh = true
require_health_verification = true

[mcp_orchestrator.execution]
negative_premortem_required_for_file_system = true
negative_premortem_required_for_system_tools = true
revalidate_before_execution = true
block_if_premortem_unavailable = true

[mcp_orchestrator.logging]
enabled = true
max_log_size_mb = 10
backup_count = 5

# =============================================================================
# DAY 13 — AUTONOMOUS INTELLIGENCE CORE
# =============================================================================

[autonomous_brain]
enabled = true
model = "gemini-2.5-flash"
temperature = 0.2
audit_timeout_seconds = 45
