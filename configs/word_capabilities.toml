# =============================================================================
# Zye Day 21 — Advanced Microsoft Word Automation Configuration
# =============================================================================

[word]
enabled = true
advanced_automation_enabled = true
attach_existing_by_default = true
require_document_identity_check = true
max_document_preview_chars = 5000
max_bulk_replacements = 100
max_table_rows = 500
max_table_columns = 50

[formatting]
allow_custom_styles = true
allow_document_wide_formatting = true
require_confirmation_for_document_wide_changes = true

[tables]
allow_table_creation = true
allow_bulk_table_population = true
max_cells_per_operation = 10000

[review]
track_changes_enabled = true
require_confirmation_for_bulk_accept = true
require_confirmation_for_bulk_reject = true

[mail_merge]
enabled = true
allow_csv_source = true
allow_xlsx_source = true
require_preview_before_execution = true
require_confirmation_for_bulk_generation = true
automatic_email_sending = false

[pdf]
enabled = true
verify_output = true
allow_silent_overwrite = false

[security]
allow_arbitrary_python = false
allow_arbitrary_com_scripts = false
allow_unrestricted_vba = false
require_operation_registry = true
require_path_validation = true

# =============================================================================
# Professional Document Templates (Section 21)
# =============================================================================

[templates.business_report]
